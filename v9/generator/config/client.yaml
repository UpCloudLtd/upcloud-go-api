# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/refs/tags/v2.8.0/configuration-schema.json
package: upcloud
compatibility:
  always-prefix-enum-values: true
generate:
  client: true
  models: false
  embedded-spec: false
  server-urls: false
output-options:
  resolve-type-name-collisions: true
  # response-type-suffix changes the suffix for operation response wrapper types
  # from "Response" (default) to "Resp" to avoid collisions with schema types.
  # Example: createServer operation generates CreateServerResp instead of
  # CreateServerResponse, which would collide with the createServerResponse schema.
  response-type-suffix: "Resp"
  overlay:
    path: ./generator/config/overlay/oapi-codegen.yaml
    strict: false
  user-templates:
    # client.tmpl customized to prefix ClientInterface with the tag name and remove shared client boilerplate from
    # https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/refs/tags/v2.8.0/pkg/codegen/templates/client.tmpl
    client.tmpl: ./generator/config/templates/client.tmpl
    # client-with-responses.tmpl customized to prefix ClientWithResponsesInterface with the tag name and remove shared client boilerplate from
    # https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/refs/tags/v2.8.0/pkg/codegen/templates/client-with-responses.tmpl
    client-with-responses.tmpl: ./generator/config/templates/client-with-responses.tmpl
