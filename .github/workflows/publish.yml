name: Publish
on:
  push:
    tags:
      - 'v*.*.*'
permissions: {}
jobs:
  publish_release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Get tag version
        run: echo "tag_version=$(make version)" >> "$GITHUB_OUTPUT"
      - name: Get release notes for v8
        if: ${{ startsWith(github.ref, 'refs/tags/v8.') }}
        run: make release-notes > .release_notes
      - name: Get release notes for v9
        if: ${{ startsWith(github.ref, 'refs/tags/v9.') }}
        run: make release-notes CHANGELOG=v9/CHANGELOG.md > .release_notes
      - name: Run goreleaser-action
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --clean --release-notes=.release_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
