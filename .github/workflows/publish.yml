name: Publish
on:
  push:
    tags:
      - 'v*.*.*'
  # tag-v9.yml calls this. Tags pushed with GITHUB_TOKEN start no workflow.
  workflow_call:
    inputs:
      tag:
        description: Tag to release, e.g. v9.0.0-alpha.0.0.118.0
        required: true
        type: string
permissions: {}
jobs:
  publish_release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    # The tag push and tag-v9.yml can both publish one tag. Run them in turn.
    concurrency: publish-${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "ERROR: bad tag: $TAG" >&2
            exit 1
          fi
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - name: Get release notes for v8
        if: ${{ startsWith(env.TAG, 'v8.') }}
        run: make release-notes VERSION="$TAG" > .release_notes
      - name: Get release notes for v9
        if: ${{ startsWith(env.TAG, 'v9.') }}
        run: >-
          make release-notes VERSION="$TAG" CHANGELOG=v9/CHANGELOG.md
          > .release_notes
      - name: Check release notes
        run: |
          if [[ ! -s .release_notes ]]; then
            echo "ERROR: no changelog section for $TAG" >&2
            exit 1
          fi
      - name: Run goreleaser-action
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean --release-notes=.release_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
