# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Regenerate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Spec version (e.g. 1.2.3)
        required: true
        type: string
      asset_url:
        description: GitHub API URL for the spec tarball release asset
        required: true
        type: string
      spec_file:
        description: Spec filename inside the released spec tarball
        required: true
        type: string
      spec_sha256:
        description: SHA-256 of the extracted spec JSON file
        required: true
        type: string

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v9
          fetch-depth: 1

      - name: Download spec
        env:
          ASSET_URL: ${{ github.event.inputs.asset_url }}
          SPEC_FILE: ${{ github.event.inputs.spec_file }}
          SPEC_VERSION: ${{ github.event.inputs.version }}
          SPEC_SHA256: ${{ github.event.inputs.spec_sha256 }}
          SPECS_ACCESS_PAT: ${{ secrets.SPECS_ACCESS_PAT }}
        run: |
          set -euo pipefail

          : "${ASSET_URL:?ERROR: Missing asset_url in dispatch event}"
          : "${SPEC_FILE:?ERROR: Missing spec_file in dispatch event}"
          : "${SPEC_VERSION:?ERROR: Missing version in dispatch event}"
          : "${SPEC_SHA256:?ERROR: Missing spec_sha256 in dispatch event}"
          : "${SPECS_ACCESS_PAT:?ERROR: SPECS_ACCESS_PAT secret is not set}"
          if [[ ! "$SPEC_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "ERROR: spec_sha256 must be 64 hexadecimal characters" >&2
            exit 1
          fi
          python3 - "$ASSET_URL" <<'PY'
          import sys
          from urllib.parse import urlsplit

          try:
              asset_url = urlsplit(sys.argv[1])
              port = asset_url.port
          except ValueError:
              port = -1
              asset_url = None

          if (
              asset_url is None
              or asset_url.scheme != "https"
              or asset_url.hostname != "api.github.com"
              or asset_url.username is not None
              or asset_url.password is not None
              or port not in (None, 443)
          ):
              print("ERROR: asset_url must use HTTPS on api.github.com", file=sys.stderr)
              sys.exit(1)
          PY

          SPEC_ARCHIVE="${RUNNER_TEMP}/spec.tar.gz"
          curl --fail -L \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 120 \
            -H "Authorization: Bearer $SPECS_ACCESS_PAT" \
            -H "Accept: application/octet-stream" \
            "$ASSET_URL" \
            -o "$SPEC_ARCHIVE"

          bash v9/generator/scripts/install-spec.sh \
            "$SPEC_ARCHIVE" "$SPEC_FILE" "$SPEC_VERSION" "$SPEC_SHA256"

      - uses: jdx/mise-action@v4.2.1
        with:
          version: 2026.3.9 # [default: latest] mise version to install
          install: true # [default: true] run `mise install`
          cache: true # [default: true] cache mise using GitHub's cache
          working_directory: v9

      - name: Generate SDK
        working-directory: v9
        run: mise run generate

      - name: Generate request-conformance adapters
        working-directory: v9
        run: make generate-request-adapters

      - name: Inject spec version
        env:
          SPEC_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          : "${SPEC_VERSION:?ERROR: Missing version in dispatch event}"
          cat > v9/pkg/upcloud/spec_version.go <<EOF
          package upcloud

          const specVersion = "${SPEC_VERSION}"
          EOF

      - name: Clean temporary spec download
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/spec" "$RUNNER_TEMP/spec.tar.gz"

      - name: Create PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: regenerate v9/pkg/upcloud (${{ github.event.inputs.version }})"
          branch: "chore/regenerate/${{ github.event.inputs.version }}"
          title: "Regenerate v9/pkg/upcloud (${{ github.event.inputs.version }})"
          base: v9
          body: >
            Automated regeneration for spec version
            `${{ github.event.inputs.version }}`.
