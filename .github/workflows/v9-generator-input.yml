name: V9 Generator Input

on:
  pull_request:
  push:
    branches: [v9]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'

jobs:
  generator-input:
    name: V9 Generator Input (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.0', '1.26.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: v9/go.sum
      - name: Test real generation input handling
        working-directory: v9
        run: |
          command -v jq
          make -C generator test